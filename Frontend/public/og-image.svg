<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <!-- گرادینت پس‌زمینه دارک -->
        <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#1f1a10" />
            <stop offset="60%" stop-color="#0e1017" />
            <stop offset="100%" stop-color="#090a0f" />
        </radialGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.8" opacity="0.35" />
        </pattern>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="16" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- پس‌زمینه -->
    <rect width="1200" height="630" fill="url(#bgGlow)" />
    <!-- گرید D&D بوم -->
    <rect width="1200" height="630" fill="url(#grid)" />

    <!-- هاله نور طلایی و کهکشانی -->
    <circle cx="600" cy="240" r="180" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />
    <circle cx="350" cy="400" r="140" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

    <!-- آیکون تاس بیست‌وجهی D20 مرکزی -->
    <g transform="translate(540, 90)">
        <polygon points="60,10 110,38 110,95 60,123 10,95 10,38" fill="#18181b" stroke="#f59e0b" stroke-width="3" />
        <polygon points="60,10 60,123 110,95" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.6" />
        <polygon points="60,10 10,95 60,123" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.6" />
        <polygon points="60,10 10,38 110,38" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.7" />
        <text x="60" y="78" font-family="Vazirmatn, sans-serif" font-size="28" font-weight="900" fill="#fbbf24" text-anchor="middle">20</text>
    </g>

    <!-- تیتر اصلی فارسی -->
    <text x="600" y="300" font-family="Vazirmatn, sans-serif" font-size="58" font-weight="900" fill="#f4f4f5" text-anchor="middle" letter-spacing="-1">
        Persian VTT
    </text>

    <text x="600" y="365" font-family="Vazirmatn, sans-serif" font-size="34" font-weight="800" fill="url(#goldGrad)" text-anchor="middle">
        میز بازی مجازی ماجراجویی‌های رومیزی و D&amp;D
    </text>

    <!-- توضیحات فرعی -->
    <text x="600" y="430" font-family="Vazirmatn, sans-serif" font-size="20" font-weight="500" fill="#a1a1aa" text-anchor="middle">
        تاس‌های سه‌بعدی پویا · مه‌جنگ لحظه‌ای · ارتباط زنده صوتی · کاملاً فارسی و روان
    </text>

    <!-- چیپ‌های پایین تصویر -->
    <g transform="translate(360, 490)">
        <!-- چیپ D&D 5e -->
        <rect x="0" y="0" width="140" height="42" rx="21" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
        <text x="70" y="27" font-family="sans-serif" font-size="15" font-weight="700" fill="#e4e4e7" text-anchor="middle">D&amp;D 5E Ready</text>

        <!-- چیپ تاس 3D -->
        <rect x="160" y="0" width="150" height="42" rx="21" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
        <text x="235" y="27" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">🎲 تاس ۳بعدی فیزیکی</text>

        <!-- چیپ صدای زنده -->
        <rect x="330" y="0" width="150" height="42" rx="21" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
        <text x="405" y="27" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">🎙️ مکالمه صوتی زنده</text>
    </g>
</svg>